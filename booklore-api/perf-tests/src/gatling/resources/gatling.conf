#########################
# Gatling configuration #
#########################
# Only overrides vs. the bundled defaults are listed here.

gatling {
  core {
    runDescription = "booklore-api performance test"
    # Keep per-request data out of reports to keep them small
    extract {
      regex {
        cacheMaxCapacity = 200
      }
      jsonPath {
        cacheMaxCapacity = 200
      }
    }
  }
  charting {
    noReports = false
  }
  http {
    warmUpUrl = ""
  }
}
