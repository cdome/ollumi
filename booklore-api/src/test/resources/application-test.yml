spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true   # run schema.sql after Hibernate builds the entity schema
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always   # recreate jOOQ-migrated tables (schema.sql) that no longer have a JPA @Entity
  flyway:
    enabled: false
app:
  bookdrop-folder: build/bookdrop
  path-config: build/app-data
